name: Installer TopMath depuis le ZIP

on:
  push:
    paths:
      - 'TopMath_D1_REFERENTIELS_COMPLETS_IPAD_EDGE_CORRIGE.zip'
      - '.github/workflows/unpack-topmath.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Decompresser TopMath
        shell: bash
        run: |
          set -e
          ZIP="TopMath_D1_REFERENTIELS_COMPLETS_IPAD_EDGE_CORRIGE.zip"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          SRC="$TMP/TopMath_D1_REFERENTIELS_COMPLETS_IPAD_EDGE"

          test -f "$SRC/index.html"

          cp -a "$SRC"/. .

          rm -f "$ZIP"
          rm -f .github/workflows/unpack-topmath.yml

      - name: Enregistrer TopMath
        shell: bash
        run: |
          git config user.name "TopMath setup"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Installer la version complete de TopMath"
          git push

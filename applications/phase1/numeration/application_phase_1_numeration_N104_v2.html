<body><main class="wrap"><header class="head"><div class="pill">NUMÉRATION · PHASE 1</div><h1>N104</h1><p>Addition posée</p><nav class="tabs" id="tabs" aria-label="Choisir un exercice"></nav></header><section class="sheet" id="sheet"><div id="exercise"><div class="sheetTop"><button class="finish" id="finish" type="button">▣ Terminer mes exercices</button></div><h2 class="instruction" id="instruction">Pose et calcule l’addition.</h2><div class="workspace"><div id="context" class="context"></div><div class="calc" id="calc"></div><div id="hintArea" class="hintArea hidden"></div><div class="feedback" id="feedback" aria-live="polite"></div></div><div class="actions"><div class="arrows"><button type="button" class="action arrow" id="prev" aria-label="Exercice précédent">←</button><button type="button" class="action arrow" id="next" aria-label="Exercice suivant">→</button></div><button class="action verify" type="button" id="verify">✓ Vérifier</button><div class="rightButtons"><button class="hintBtn" type="button" id="hint" aria-label="Indice">?</button><button class="action skip" type="button" id="skip">Passer</button></div></div></div><section id="report" class="report hidden" aria-label="Bilan pédagogique"></section></section><footer class="foot">Top’Math · Un nouveau parcours de 10 exercices à chaque ouverture.</footer></main>

<div class="dialogBackdrop hidden" id="padBackdrop" role="presentation"><div class="dialog popup" role="dialog" aria-modal="true" aria-labelledby="padTitle"><div class="padTop"><strong id="padTitle">Choisis un chiffre</strong><button type="button" id="closePad" aria-label="Fermer">✕</button></div><div class="pad" id="pad"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const names=['Milliers','Centaines','Dizaines','Unités'];const rankNames=['milliers','centaines','dizaines','unités'];const ranks=['UM','C','D','U'];const colors=['black','green','red','blue'];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const fmt=n=>new Intl.NumberFormat('fr-BE').format(n);const pad4=n=>String(n).padStart(4,'0').split('').map(Number);
const storageKey='topmath_N104_essais_v2';let tasks=[],index=0,reportOpen=false,sessionId=Math.random().toString(36).slice(2),saved=false,padTarget=null;
function carryInfo(a,b){let c=0,carry=[0,0,0,0],result=[0,0,0,0];const ad=pad4(a),bd=pad4(b);for(let i=3;i>=0;i--){carry[i]=c;const z=ad[i]+bd[i]+c;result[i]=z%10;c=Math.floor(z/10)}return {carry,result,overflow:c}}
function createTasks(){const specs=[{min:10,max:90,mode:'guidé',needCarry:false},{min:100,max:450,mode:'guidé',needCarry:false},{min:100,max:650,mode:'guidé',needCarry:true},{min:100,max:900,mode:'guidé',needCarry:true},{min:200,max:2200,mode:'entraînement',needCarry:false},{min:300,max:3900,mode:'entraînement',needCarry:true},{min:900,max:4900,mode:'entraînement',needCarry:true},{min:1000,max:7000,mode:'autonomie',needCarry:false},{min:1200,max:7900,mode:'autonomie',needCarry:true},{min:1500,max:8500,mode:'autonomie',needCarry:true}];const used=new Set();return specs.map((s,k)=>{let a,b,info,tries=0;do{a=rand(s.min,s.max);const upper=Math.min(s.max,9999-a);b=rand(s.min,Math.max(s.min,upper));info=carryInfo(a,b);tries++}while((a+b>9999||info.overflow||used.has([a,b].sort((x,y)=>x-y).join('-'))||((info.carry.some((v,i)=>i<3&&v===1))!==s.needCarry))&&tries<15000);
if(tries>=15000)throw new Error('Génération impossible');used.add([a,b].sort((x,y)=>x-y).join('-'));const active=Math.max(2,String(a+b).length,String(a).length,String(b).length);return {a,b,...info,active,mode:s.mode,enteredA:Array(4).fill(null),enteredB:Array(4).fill(null),enteredResult:Array(4).fill(null),enteredCarry:Array(4).fill(null),completed:false,skipped:false,attempts:0,errors:[],hints:0,showHint:false}})}
function current(){return tasks[index]}
function toDigitText(value){return value===null?'·':String(value)}
function renderTabs(){const nav=$('tabs');nav.innerHTML=tasks.map((t,i)=>`<button type="button" class="tab ${i===index&&!reportOpen?'active':''} ${t.completed?'done':t.skipped?'passed':''}" aria-label="Exercice ${i+1}" aria-current="${i===index&&!reportOpen?'step':'false'}" data-tab="${i}">${i+1}</button>`).join('');nav.querySelectorAll('button').forEach(b=>{b.onclick=()=>{if(reportOpen)return;index=Number(b.dataset.tab);render()}})}
function cellButton(t,kind,i){const isCarry=kind==='carry',arr=isCarry?t.enteredCarry:t.enteredResult,disabled=t.completed||t.skipped;return `<button type="button" class="cell ${isCarry?'carryCell':'resultCell'} ${arr[i]!==null?'filled':''} ${colors[i]}" data-kind="${kind}" data-col="${i}" aria-label="${isCarry?'Retenue':'Résultat'} colonne ${names[i]}" ${disabled?'disabled':''}>${toDigitText(arr[i])}</button>`}
function operandRow(t,kind,symbol){const digits=kind==='a'?t.enteredA:t.enteredB;const min=4-t.active;return `<div class="calcRow"><span class="operator">${symbol}</span>${ranks.map((r,i)=>i>=min?`<button type="button" class="cell operandCell ${colors[i]} ${digits[i]!==null?'filled':''}" data-kind="${kind}" data-col="${i}" aria-label="${kind==='a'?'Premier':'Deuxième'} nombre, ${names[i]}" ${t.completed||t.skipped?'disabled':''}>${toDigitText(digits[i])}</button>`:'<div></div>').join('')}</div>`}
function render(){renderTabs();$('report').classList.add('hidden');$('exercise').classList.remove('hidden');const t=current();$('instruction').textContent='Place les nombres, puis additionne.';$('context').textContent='';
const activeBegin=4-t.active;let carryCells=ranks.map((_,i)=>i>=activeBegin&&i<3?cellButton(t,'carry',i):'<div></div>').join('');let sumCells=ranks.map((_,i)=>i>=activeBegin?cellButton(t,'result',i):'<div></div>').join('');$('calc').innerHTML=`<p class="operationPrompt">${fmt(t.a)} + ${fmt(t.b)}</p><div class="calcLegend"><span></span>${ranks.map((r,i)=>`<span class="rank ${colors[i]}">${r}</span>`).join('')}</div><div class="calcRow carryRow"><span class="carryLabel">Retenues</span>${carryCells}</div>${operandRow(t,'a','')}${operandRow(t,'b','+')}<div class="sumSeparator"></div><div class="calcRow"><span class="operator">=</span>${sumCells}</div>`;
$('calc').querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>openPad(b.dataset.kind,Number(b.dataset.col))));$('prev').disabled=index===0;$('next').disabled=index===9;$('verify').disabled=t.completed||t.skipped;$('skip').disabled=t.completed||t.skipped;$('hint').disabled=t.completed||t.skipped;
$('hintArea').classList.toggle('hidden',!t.showHint);if(t.showHint)showHint();$('feedback').textContent=t.completed?'Addition réussie !':t.skipped?'Exercice passé.':'';$('feedback').className='feedback '+(t.completed?'good':'')}
function openPad(kind,col){const t=current();if(t.completed||t.skipped)return;padTarget={kind,col};$('padTitle').textContent=({carry:'Retenue',result:'Résultat',a:'Premier nombre',b:'Deuxième nombre'}[kind])+' : '+names[col];$('pad').innerHTML=Array.from({length:9},(_,i)=>`<button type="button" data-digit="${i+1}">${i+1}</button>`).join('')+`<button type="button" class="clear" data-digit="clear">Effacer</button><button type="button" class="zero" data-digit="0">0</button><button type="button" class="close" data-digit="close">Fermer</button>`;$('pad').querySelectorAll('button').forEach(b=>b.onclick=()=>{const choice=b.dataset.digit;if(choice==='close'){closePad();return}const arr=({carry:t.enteredCarry,result:t.enteredResult,a:t.enteredA,b:t.enteredB})[padTarget.kind];arr[padTarget.col]=choice==='clear'?null:Number(choice);closePad();render()});$('padBackdrop').classList.remove('hidden');$('pad').querySelector('button').focus()}
function closePad(){$('padBackdrop').classList.add('hidden');padTarget=null}
$('closePad').onclick=closePad;$('padBackdrop').addEventListener('click',e=>{if(e.target===$('padBackdrop'))closePad()});
function showHint(){const t=current();let guidance;if(t.hints===1)guidance='Place les unités à droite.';else if(t.hints===2)guidance='Aligne unités sous unités et dizaines sous dizaines.';else guidance='Additionne de droite à gauche. Écris 1 en retenue si une colonne dépasse 9.';$('hintArea').textContent=guidance}
function hint(){const t=current();t.hints=Math.min(t.hints+1,3);t.showHint=true;showHint();$('hintArea').classList.remove('hidden')}
function verify(){const t=current();if(t.completed||t.skipped)return;const start=4-t.active;const ad=pad4(t.a),bd=pad4(t.b);let missing=false;for(let i=start;i<4;i++){if(t.enteredResult[i]===null)missing=true; if(i>=4-String(t.a).length&&t.enteredA[i]===null)missing=true;if(i>=4-String(t.b).length&&t.enteredB[i]===null)missing=true}if(missing){feedback('Place les chiffres et complète le résultat.',true);return}let mistakes=[];for(let i=start;i<4;i++){const expectedA=i<4-String(t.a).length?null:ad[i],expectedB=i<4-String(t.b).length?null:bd[i];if(t.enteredA[i]!==expectedA)mistakes.push({kind:'placement du premier nombre',col:i,entered:t.enteredA[i],expected:expectedA});if(t.enteredB[i]!==expectedB)mistakes.push({kind:'placement du deuxième nombre',col:i,entered:t.enteredB[i],expected:expectedB});if(t.enteredResult[i]!==t.result[i])mistakes.push({kind:'calcul',col:i,entered:t.enteredResult[i],expected:t.result[i]})}for(let i=start;i<3;i++){if(t.carry[i]===1&&t.enteredCarry[i]===null)mistakes.push({kind:'retenue oubliée',col:i,entered:null,expected:1});else if(t.enteredCarry[i]!==null&&t.enteredCarry[i]!==t.carry[i])mistakes.push({kind:'retenue incorrecte',col:i,entered:t.enteredCarry[i],expected:t.carry[i]})}t.attempts++;if(!mistakes.length){t.completed=true;render();feedback('Bravo ! Addition correcte.',false);return}t.errors.push({attempt:t.attempts,mistakes,enteredA:t.enteredA.slice(),enteredB:t.enteredB.slice(),enteredResult:t.enteredResult.slice(),enteredCarry:t.enteredCarry.slice()});const first=mistakes[0];feedback(first.kind.startsWith('placement')?`Vérifie le placement des ${names[first.col].toLowerCase()}.`:first.kind==='calcul'?`Vérifie le calcul des ${names[first.col].toLowerCase()}.`:`Vérifie la retenue des ${names[first.col].toLowerCase()}.`,true)}
function feedback(message,error){$('feedback').textContent=message;$('feedback').className='feedback '+(error?'error':'good')}
function skip(){const t=current();if(t.completed||t.skipped)return;t.skipped=true;if(index<9){index++;render()}else{render();finish()}}
function finish(){const pending=tasks.filter(t=>!t.completed&&!t.skipped).length;$('finishText').textContent=pending?`Il reste ${pending} exercice${pending>1?'s':''} non terminé${pending>1?'s':''}. Ils apparaîtront comme non terminés dans le bilan.`:'Tu as parcouru les 10 exercices. Ton bilan va s’afficher.';$('finishBackdrop').classList.remove('hidden');$('cancelFinish').focus()}
function closeFinish(){$('finishBackdrop').classList.add('hidden')}$('finish').onclick=finish;$('cancelFinish').onclick=closeFinish;$('confirmFinish').onclick=()=>{closeFinish();reportOpen=true;renderReport()};$('finishBackdrop').addEventListener('click',e=>{if(e.target===$('finishBackdrop'))closeFinish()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePad();closeFinish()}if(!$('padBackdrop').classList.contains('hidden')&&/^[0-9]$/.test(e.key)){const target=$('pad').querySelector(`[data-digit="${e.key}"]`);if(target)target.click()}});
function safe(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function summary(t){return `${fmt(t.a)} + ${fmt(t.b)} = ${fmt(t.a+t.b)}`}
function renderReport(){renderTabs();$('exercise').classList.add('hidden');$('report').classList.remove('hidden');const successes=tasks.filter(t=>t.completed).length,skipped=tasks.filter(t=>t.skipped).length,errorChecks=tasks.reduce((z,t)=>z+t.errors.length,0),carryErrors=tasks.reduce((z,t)=>z+t.errors.flatMap(x=>x.mistakes).filter(m=>m.kind.includes('retenue')).length,0),calcErrors=tasks.reduce((z,t)=>z+t.errors.flatMap(x=>x.mistakes).filter(m=>m.kind==='calcul').length,0);
const bars=tasks.map((t,i)=>`<div class="barItem"><div class="bar ${t.completed?'success':t.skipped?'skipped':''}" title="Exercice ${i+1} : ${t.completed?'réussi':t.skipped?'passé':'non terminé'}"></div>${i+1}</div>`).join('');const rows=tasks.map((t,i)=>{const state=t.completed?'Réussi':t.skipped?'Passé':'Non terminé';const cls=t.completed?'success':t.skipped?'skipped':'pending';const mistakes=t.errors.map(err=>`<li>Essai ${err.attempt} : ${err.mistakes.map(m=>`${m.kind} (${rankNames[m.col]})`).join(' ; ')}</li>`).join('');return `<article class="detail"><div class="detailHead"><strong>Exercice ${i+1}</strong><span class="tag ${cls}">${state}</span></div><p class="detailText">${fmt(t.a)} + ${fmt(t.b)}</p><div class="detailMeta"><span>Vérifications : <b>${t.attempts}</b></span><span>Essais incorrects : <b>${t.errors.length}</b></span><span>Indices : <b>${t.hints}</b></span></div>${mistakes?`<ul class="mistakes">${mistakes}</ul>`:'<p class="note">Aucune erreur vérifiée.</p>'}<p class="answer">Correction : ${summary(t)}</p></article>`}).join('');let advice=[];if(carryErrors)advice.push('Retenues : quand une colonne atteint 10, écris 1 dans la colonne de gauche.');if(calcErrors)advice.push('Calcul : additionne les chiffres de la même colonne, en commençant à droite.');if(tasks.some(t=>t.errors.some(e=>e.mistakes.some(m=>m.kind.startsWith('placement')))))advice.push('Placement : aligne les unités sous les unités et les dizaines sous les dizaines.');if(!advice.length)advice.push('Continue à t’entraîner avec de nouvelles additions.');
$('report').innerHTML=`<h2>Mon bilan — N104</h2><p class="reportSub">Addition posée</p><div class="hero"><div class="grade">${successes}/10<small>Exercices réussis</small></div><div><div class="bars" role="img" aria-label="${successes} exercices réussis sur 10">${bars}</div><div class="legend"><span><i style="background:#18966b"></i>Réussi</span><span><i style="background:#e7a24a"></i>Passé</span><span><i style="background:#c9d4e3"></i>Non terminé</span></div></div></div><div class="kpis"><div class="kpi"><b>${successes}</b><small>Réussis</small></div><div class="kpi"><b>${errorChecks}</b><small>Vérifications incorrectes</small></div><div class="kpi"><b>${skipped}</b><small>Passés</small></div></div><h3>Mes 10 exercices</h3>${rows}<h3>Pour progresser</h3><div class="advice">${advice.map(a=>`<div>✓ ${safe(a)}</div>`).join('')}</div><p class="note">Un exercice réussi après correction compte comme réussi. Les erreurs restent visibles dans le détail.</p><div class="reportTools screenOnly"><input id="studentCode" maxlength="40" placeholder="Prénom ou code élève" aria-label="Prénom ou code élève"><button class="action verify" id="saveAttempt" type="button">Valider mon essai</button></div><p class="note screenOnly" id="saveNotice" role="status"></p><div class="reportTools screenOnly"><button class="action" id="printReport" type="button">Imprimer / PDF</button><button class="action verify" id="newSeries" type="button">Nouvelle série</button></div>`;$('saveAttempt').onclick=saveAttempt;$('printReport').onclick=()=>window.print();$('newSeries').onclick=()=>{if(confirm('Recommencer avec 10 nouvelles additions ?')){reset();render()}}}
function getHistory(){try{const value=JSON.parse(localStorage.getItem(storageKey)||'{}');return value&&typeof value==='object'?value:{}}catch{return {}}}
function saveAttempt(){if(saved){$('saveNotice').textContent='Cet essai a déjà été enregistré.';return}const student=$('studentCode').value.trim();if(!student){$('saveNotice').textContent='Indique un prénom ou un code élève.';$('studentCode').focus();return}try{const data=getHistory();const key=student.toLocaleLowerCase('fr');const old=Array.isArray(data[key])?data[key]:[];const entry={essay:old.length+1,date:new Date().toISOString(),score:tasks.filter(t=>t.completed).length,exercises:tasks.map(t=>({a:t.a,b:t.b,status:t.completed?'réussi':t.skipped?'passé':'non terminé',attempts:t.attempts,hints:t.hints,errors:t.errors}))};data[key]=[...old,entry];localStorage.setItem(storageKey,JSON.stringify(data));saved=true;$('saveAttempt').disabled=true;$('saveNotice').textContent=`Essai ${entry.essay} enregistré sur cet appareil.`}catch(e){$('saveNotice').textContent='Enregistrement indisponible dans ce navigateur. Imprime le bilan en PDF.'}}
function reset(){tasks=createTasks();index=0;reportOpen=false;sessionId=Math.random().toString(36).slice(2);saved=false}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<9){index++;render()}else finish()};$('verify').onclick=verify;$('skip').onclick=skip;$('hint').onclick=hint;
reset();render();
})();
</script></body></html>

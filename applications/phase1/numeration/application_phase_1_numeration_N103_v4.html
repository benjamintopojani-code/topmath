</style></head><body><main class="wrap"><header class="top"><span class="pill">NUMÉRATION · PHASE 1</span><h1>N103</h1><p class="sub">Comparer deux nombres de 3 à 6 chiffres</p><nav class="tabs" id="tabs" aria-label="Exercices"></nav></header><section class="panel"><div id="exercise"><div class="exerciseTop"><button type="button" class="finishBtn" id="finish" title="Terminer et voir le bilan" aria-label="Terminer mes exercices et afficher le bilan"><span aria-hidden="true">☑</span> Terminer mes exercices</button></div><h2 class="instruction" id="instruction"></h2><div class="work" id="work"></div><div class="feedback hidden" id="feedback" role="status" aria-live="polite"></div><div class="actions newActions"><div class="navActions"><button class="action arrowBtn" id="prev" title="Exercice précédent" aria-label="Exercice précédent">←</button><button class="action arrowBtn" id="next" title="Exercice suivant" aria-label="Exercice suivant">→</button></div><button class="action primary verifyBtn" id="verify">✓ Vérifier</button><div class="extraActions"><button class="action hintBtn" id="hint" title="Afficher un indice" aria-label="Afficher un indice">?</button><button class="action skipBtn" id="skip">Passer ↷</button></div></div></div><div id="report" class="result hidden"></div></section><div class="footer">Top’Math · N103 V4 · Parcours de 10 exercices · Nouvelle série à chaque ouverture</div></main>
<div class="confirmOverlay hidden" id="finishModal" role="dialog" aria-modal="true" aria-labelledby="finishTitle" aria-describedby="finishDescription">
<div class="confirmCard"><div class="confirmIcon" aria-hidden="true">✓</div><h2 id="finishTitle">Terminer les exercices ?</h2><p id="finishDescription">Ton bilan va s'afficher.</p><div class="confirmButtons"><button type="button" class="action" id="cancelFinish">Continuer</button><button type="button" class="action primary" id="confirmFinish">Oui, terminer</button></div></div></div>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), grouped=n=>Number(n).toLocaleString('fr-BE'), colors=['#1767d3','#cb343b','#18854b','#181818','#9b53ad','#a56422'], columns=['U','D','C','UM','DM','CM'];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, mix=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=rand(0,i);[b[i],b[j]]=[b[j],b[i]];}return b};
const pow=digits=>10**(digits-1), number=digits=>rand(pow(digits),10**digits-1);
const asDigits=n=>String(n).padStart(6,'0').split('').reverse();
function colorNumber(n){let s=String(n);return [...s].map((d,i)=>`<span style="color:${colors[s.length-i-1]||'#171717'}">${d}</span>`).join('')}
const unique=new Set();function oncePair(digits,kind){for(let t=0;t<1000;t++){let a=number(digits),b;if(kind==='equal')b=a;else if(kind==='close'){let p=10**rand(0,Math.max(0,digits-2));b=a+(Math.random()<.5?-1:1)*rand(1,8)*p;if(b<pow(digits)||b>10**digits-1)continue;}else if(kind==='zero'){a=Math.floor(a/100)*100+rand(0,9);b=a+(Math.random()<.5?-1:1)*rand(1,9)*10;if(b<pow(digits)||b>10**digits-1)continue;}else b=number(digits);let id=[Math.min(a,b),Math.max(a,b)].join(':');if(!unique.has(id)){unique.add(id);return {a,b}}}throw Error('Génération impossible')}
function create(){const def=[['symbol',3,'random'],['symbol',3,'close'],['abacus',4,'random'],['abacus',4,'close'],['symbol',4,'zero'],['abacus',5,'close'],['abacus',5,'zero'],['symbol',5,'equal'],['symbol',5,'random'],['symbol',6,'close']];return def.map(([type,d,kind],index)=>{let x={index,type,d,kind,chosen:null,tries:0,hints:0,completed:false,skipped:false,wrongAnswers:[]};if(type==='order'){let vals=new Set();while(vals.size<4)vals.add(number(d));x.values=mix([...vals]);x.selected=[];x.answer=[...vals].sort((a,b)=>a-b)}else if(type==='line'){// position a marker between the two ordered labels; correct midpoint is 50%
let {a,b}=oncePair(d,kind);if(a===b)b++;x.left=Math.min(a,b);x.right=Math.max(a,b);x.marker=rand(10,90);x.target=x.left+(x.right-x.left)*.5; x.markerAnswer=50;
}else{Object.assign(x,oncePair(d,kind));x.answer=x.a>x.b?'>':x.a<x.b?'<':'='}return x})}
let tasks=create(),index=0,showReport=false, attemptsKey='topmath_N103_local_attempts_v1';
function store(){try{return JSON.parse(localStorage.getItem(attemptsKey)||'[]')}catch(e){return []}}
function saveAttempt(){const name=($('student').value||'').trim().slice(0,30);if(!name){$('saveMsg').textContent='Écris ton prénom ou ton code.';return}let entries=store();if(entries.some(e=>e.session===sessionID)){ $('saveMsg').textContent='Cet essai est déjà enregistré.';return;}let count=entries.filter(e=>e.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr')).length+1;entries.push({name,number:count,session:sessionID,date:new Date().toISOString(),score:tasks.filter(t=>t.completed).length,errors:tasks.reduce((n,t)=>n+t.tries,0),skipped:tasks.filter(t=>t.skipped).length,details:tasks.map(t=>({type:t.type,ok:t.completed,tries:t.tries,attempts:t.tries+(t.completed?1:0),wrongAnswers:t.wrongAnswers||[],expected:describeAnswer(t)}))});try{localStorage.setItem(attemptsKey,JSON.stringify(entries));$('saveMsg').textContent='Essai '+count+' enregistré sur cet appareil.';$('save').disabled=true}catch(e){$('saveMsg').textContent='Sauvegarde indisponible dans ce navigateur.'}}
let sessionID=Date.now()+'-'+Math.random();
function tabs(){ $('tabs').innerHTML=tasks.map((t,i)=>`<button type="button" class="tab ${i===index?'active':''} ${t.completed?'ok':t.skipped?'fail':''}" data-tab="${i}" aria-label="Exercice ${i+1}">${i+1}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(showReport)return;index=+b.dataset.tab;render()})}
function setFeedback(msg,hint=false){const el=$('feedback');el.classList.toggle('hidden',!msg);el.classList.toggle('hint',hint);el.textContent=msg||''}
function abacus(n){const ds=asDigits(n);return `<div class="abacus">${columns.map((c,i)=>`<div class="abacol"><div class="abah" style="color:${colors[i]}">${c}</div><div class="abad" style="color:${colors[i]}">${ds[i]}</div></div>`).reverse().join('')}</div>`}
function render(){if(showReport){renderReport();return}const t=tasks[index];tabs();$('report').classList.add('hidden');$('exercise').classList.remove('hidden');let html=''; if(t.type==='symbol'){$('instruction').textContent='Choisis le bon signe.';html=`<div class="compare"><div class="num">${colorNumber(t.a)}</div><span style="font-size:29px;color:#547093">?</span><div class="num">${colorNumber(t.b)}</div></div><div class="choices" aria-label="Signes de comparaison">${['<','>','='].map(s=>`<button class="sym ${t.chosen===s?'sel':''}" data-sign="${s}" aria-label="${s==='<'?'inférieur à':s==='>'?'supérieur à':'égal à'}">${s==='<'?'&lt;':s==='>'?'&gt;':'='}</button>`).join('')}</div>`}
else if(t.type==='abacus'){$('instruction').textContent='Compare les deux abaques.';html=`<div class="abaPair"><div class="abaBox"><label>ABAQUE A</label>${abacus(t.a)}</div><div class="abaSeparator" aria-hidden="true">↔</div><div class="abaBox"><label>ABAQUE B</label>${abacus(t.b)}</div></div><div class="choices">${['<','>','='].map(s=>`<button class="sym ${t.chosen===s?'sel':''}" data-sign="${s}">${s==='<'?'&lt;':s==='>'?'&gt;':'='}</button>`).join('')}</div>`}
else if(t.type==='order'){$('instruction').textContent='Range du plus petit au plus grand.';html=`<div class="orderSlots">${[0,1,2,3].map((_,i)=>`<div class="slot" data-slot="${i}">${t.selected[i]===undefined?'?':grouped(t.selected[i])}</div>`).join('')}</div><div class="orderList">${t.values.filter(v=>!t.selected.includes(v)).map(v=>`<button class="chip" draggable="true" data-value="${v}">${colorNumber(v)}</button>`).join('')}</div><button class="action" id="undoOrder" type="button">Retirer le dernier</button><div class="small">Touche les nombres ou glisse-les dans les cases.</div>`}
else {$('instruction').textContent='Place le point au milieu.';html=`<div class="line" id="line"><div class="rail"></div>${[0,25,50,75,100].map(v=>`<div class="tick" style="left:calc(20px + (100% - 40px) * ${v/100})"></div>`).join('')}<div class="dot" id="dot" style="left:calc(20px + (100% - 40px) * ${t.marker/100})" role="slider" tabindex="0" aria-valuenow="${t.marker}" aria-valuemin="0" aria-valuemax="100" aria-label="Position du point">◆</div><div class="ends"><span>${grouped(t.left)}</span><span>${grouped(t.right)}</span></div></div><div class="lineTools"><button class="stepper" id="decrease" aria-label="Déplacer vers la gauche">−</button><span class="small">Déplace le losange</span><button class="stepper" id="increase" aria-label="Déplacer vers la droite">+</button></div>`}
$('work').innerHTML=html;setFeedback(t.completed?'Exercice réussi.':t.skipped?'Exercice passé.':'');$('prev').disabled=index===0;$('next').disabled=index===9;$('verify').disabled=t.completed||t.skipped;$('skip').disabled=t.completed||t.skipped;
$('work').querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{t.chosen=b.dataset.sign;render()});
if(t.type==='order'){const add=v=>{if(t.selected.includes(v)||t.selected.length===4)return;t.selected.push(v);render()};$('work').querySelectorAll('[data-value]').forEach(b=>{b.onclick=()=>add(+b.dataset.value);b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',b.dataset.value)})});$('work').querySelectorAll('[data-slot]').forEach(b=>{b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();add(+e.dataTransfer.getData('text/plain'))};b.onclick=()=>{let i=+b.dataset.slot;if(t.selected[i]!==undefined){t.selected.splice(i,1);render()}}});$('undoOrder').onclick=()=>{t.selected.pop();render()}}
if(t.type==='line'){const set=x=>{t.marker=Math.max(0,Math.min(100,x));$('dot').style.left=`calc(20px + (100% - 40px) * ${t.marker/100})`;$('dot').setAttribute('aria-valuenow',t.marker)};$('decrease').onclick=()=>set(t.marker-5);$('increase').onclick=()=>set(t.marker+5);const line=$('line'),dot=$('dot');dot.onpointerdown=e=>{if(t.completed||t.skipped)return;dot.setPointerCapture(e.pointerId);let start=()=>{const r=line.getBoundingClientRect();set(Math.round((e.clientX-r.left-20)/(r.width-40)*100))};start();dot.onpointermove=v=>{if(!dot.hasPointerCapture(v.pointerId))return;const r=line.getBoundingClientRect();set(Math.round((v.clientX-r.left-20)/(r.width-40)*100))}};dot.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();set(t.marker+(e.key==='ArrowRight'?5:-5))}}}
}
function hint(){const t=tasks[index];t.hints++;let msg;if(t.type==='order')msg='Commence par le nombre qui a le moins de valeur.';else if(t.type==='line')msg='Le milieu est à la même distance des deux extrémités.';else{const a=asDigits(t.a),b=asDigits(t.b);let k=-1;for(let i=5;i>=0;i--)if(a[i]!==b[i]){k=i;break}msg=k<0?'Les deux nombres ont les mêmes chiffres.':`Compare d’abord la colonne ${['des unités','des dizaines','des centaines','des milliers','des dizaines de mille','des centaines de mille'][k]}.`}setFeedback(msg,true)}
function verify(){const t=tasks[index];if(t.completed||t.skipped)return;let valid=false;if(t.type==='order'){if(t.selected.length<4){setFeedback('Place les 4 nombres.',true);return}valid=t.selected.every((v,i)=>v===t.answer[i]);}else if(t.type==='line')valid=Math.abs(t.marker-50)<=5;else{if(t.chosen===null){setFeedback('Choisis un signe.',true);return}valid=t.chosen===t.answer;}if(valid){t.completed=true;render();setFeedback('Bravo ! Bonne réponse.')}else{t.tries++;t.wrongAnswers.push(describeResponse(t));setFeedback(t.type==='line'?'Regarde les distances de chaque côté du point.':t.type==='order'?'Vérifie l’ordre des nombres.':'Compare les chiffres de gauche à droite.',true)}}
function describeResponse(t){if(t.type==='order')return t.selected.map(grouped).join(' · ');if(t.type==='line')return 'Position '+t.marker+' %';return grouped(t.a)+' '+(t.chosen||'?')+' '+grouped(t.b)}
function describeAnswer(t){if(t.type==='order')return t.answer.map(grouped).join(' < ');if(t.type==='line')return 'Point placé à 50 %';return grouped(t.a)+' '+t.answer+' '+grouped(t.b)}
function describeQuestion(t){if(t.type==='order')return 'Ranger : '+t.values.map(grouped).join(' · ');if(t.type==='line')return 'Placer le milieu';return 'Comparer : '+grouped(t.a)+' et '+grouped(t.b)}
function end(){showReport=true;$('finishModal').classList.add('hidden');renderReport()}
function finish(){const pending=tasks.filter(t=>!t.completed&&!t.skipped).length;
$('finishDescription').textContent=pending?`Il reste ${pending} exercice${pending>1?'s':''} non terminé${pending>1?'s':''}. Tu pourras voir ton bilan, mais ces exercices seront indiqués « Non terminés ».`:'Tu as parcouru les 10 exercices. Ton bilan va s’afficher.';
$('finishModal').classList.remove('hidden');$('cancelFinish').focus()}
$('finish').onclick=finish;
$('cancelFinish').onclick=()=>{$('finishModal').classList.add('hidden');$('finish').focus()};
$('confirmFinish').onclick=end;
$('finishModal').addEventListener('click',e=>{if(e.target===$('finishModal'))$('cancelFinish').click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('finishModal').classList.contains('hidden')){$('cancelFinish').click()}});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderReport(){tabs();$('exercise').classList.add('hidden');$('report').classList.remove('hidden');
const good=tasks.filter(t=>t.completed).length,errors=tasks.reduce((n,t)=>n+t.tries,0),skipped=tasks.filter(t=>t.skipped).length;
const titles={symbol:'Comparer deux nombres',abacus:'Comparer deux abaques'};
const errorTypes={symbol:0,abacus:0};tasks.forEach(t=>errorTypes[t.type]+=t.tries+(t.skipped?1:0));
const advice=Object.entries(errorTypes).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>({symbol:'Compare les chiffres de gauche à droite.',abacus:'Regarde les chiffres de même rang dans les deux abaques.',})[k]);
const chart=tasks.map((t,i)=>`<div class="scoreCol" title="Exercice ${i+1} : ${t.completed?'réussi':t.skipped?'passé':'non terminé'}"><div class="scoreBar ${t.completed?'goodbar':t.skipped?'badbar':'pendingbar'}"></div><small>${i+1}</small></div>`).join('');
const rows=tasks.map((t,i)=>{const status=t.completed?'Réussi':t.skipped?'Passé':'Non terminé';const cls=t.completed?'goodtag':t.skipped?'badtag':'pendingtag';const attempts=t.tries+(t.completed?1:0);const wrong=(t.wrongAnswers||[]).map((x,k)=>`<li>Erreur ${k+1} : ${escapeHtml(x)}</li>`).join('');return `<article class="detailCard"><div class="detailTop"><strong>${i+1}. ${titles[t.type]}</strong><span class="statusTag ${cls}">${status}</span></div><p class="detailQuestion">${escapeHtml(describeQuestion(t))}</p><div class="detailMeta"><span>Vérifications : <b>${attempts}</b></span><span>Erreurs : <b>${t.tries}</b></span><span>Indices : <b>${t.hints}</b></span></div>${wrong?`<ul class="errorList">${wrong}</ul>`:`<p class="small">${t.completed?'Aucune erreur.':'Aucune réponse incorrecte vérifiée.'}</p>`}<p class="detailAnswer">Réponse correcte : ${escapeHtml(describeAnswer(t))}</p></article>`}).join('');
$('report').innerHTML=`<div class="reportHeader"><h2>Mon bilan — N103</h2><p>Comparer deux nombres</p></div><div class="reportHero"><div class="bigScore"><strong>${good}/10</strong><span>Exercices réussis</span></div><div><div class="scoreGraph" role="img" aria-label="${good} exercices réussis sur 10">${chart}</div><div class="legend"><span><b style="background:#1a9972"></b>Réussi</span><span><b style="background:#e7a24a"></b>Passé</span><span><b style="background:#c9d4e3"></b>Non terminé</span></div></div></div><div class="resultKpis"><div class="resultKpi"><strong>${good}</strong><span>Réussis</span></div><div class="resultKpi"><strong>${errors}</strong><span>Erreurs vérifiées</span></div><div class="resultKpi"><strong>${skipped}</strong><span>Passés</span></div></div><h3 class="resultTitle">Mes 10 exercices</h3>${rows}<h3 class="resultTitle">Pour progresser</h3><div class="adviceCard">${advice.length?advice.map(a=>`<p>✓ ${escapeHtml(a)}</p>`).join(''):'<p>✓ Continue à t’entraîner : tu n’as commis aucune erreur.</p>'}</div><p class="small">Le score compte les exercices réussis, même après correction. Les erreurs comptent les vérifications incorrectes.</p><div class="screenOnly"><h3>Enregistrer mon essai</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="student" maxlength="30" placeholder="Prénom ou code élève" style="border:1px solid #becde0;border-radius:9px;padding:12px;flex:1;min-width:160px"><button class="action primary" id="save">Valider mon essai</button></div><p id="saveMsg" class="small" role="status"></p><div class="actions"><button class="action" id="print">Imprimer le bilan</button><button class="action primary" id="restart">Nouvelle série de 10 exercices</button></div></div>`;
$('save').onclick=saveAttempt;$('print').onclick=()=>window.print();$('restart').onclick=()=>{if(!confirm('Recommencer avec 10 nouveaux exercices ?'))return;unique.clear();tasks=create();sessionID=Date.now()+'-'+Math.random();index=0;showReport=false;render()}}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('skip').onclick=()=>{tasks[index].skipped=true;if(index===9){render();finish()}else{index++;render()}};$('hint').onclick=hint;$('verify').onclick=verify;
// Le bouton Terminer permet d’afficher le bilan à tout moment ; le dernier exercice peut aussi être passé.
$('next').onclick=()=>{if(index===9)finish();else{index++;render()}};
render();
})();
</script></body></html>
